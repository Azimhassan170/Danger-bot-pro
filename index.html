<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaryTools - Deriv Live Trading Platform</title>

    <!-- PWA Manifest & Description -->
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="Danger Devil Bot Pro Trading Application">

    <!-- Stylesheets & Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center space-x-3">
            <button class="text-gray-600 text-xl"><i class="fa-solid fa-bars"></i></button>
            <a href="https://t.me" target="_blank" class="bg-sky-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center space-x-1">
                <i class="fa-paper-plane"></i> <span>Telegram</span>
            </a>
        </div>

        <!-- Before Login (Log in & Sign up Buttons) -->
        <div id="loggedOutNav" class="flex items-center space-x-2">
            <button onclick="openLoginModal()" class="bg-white hover:bg-gray-50 text-indigo-950 border border-indigo-950 font-bold px-3.5 py-1.5 rounded-xl text-xs transition">
                Log in
            </button>
            <a href="https://track.deriv.com/_b2Nl_O3m6q22ZdMg3k2d3WNdUU23N3v2/1/" target="_blank" class="bg-indigo-950 hover:bg-indigo-900 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs transition">
                Sign up
            </a>
        </div>

        <!-- After Login -->
        <div id="loggedInNav" class="hidden flex items-center space-x-3">
            <div class="text-right">
                <span id="userAccountId" class="text-xs font-bold text-gray-800 block">CR---</span>
                <span id="userBalance" class="text-xs font-black text-emerald-600">$0.00 USD</span>
            </div>
            <button onclick="disconnectToken()" class="bg-rose-100 text-rose-600 font-bold px-3 py-1.5 rounded-xl text-xs">
                Logout
            </button>
        </div>
    </header>

    <!-- Login Modal Pop-up -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold text-indigo-950 mb-1">Login with API Token</h3>
            <p class="text-xs text-gray-500 mb-4">Enter your Deriv API Token below to connect your account.</p>
            
            <input type="password" id="apiTokenInput" placeholder="Enter Deriv API Token" class="w-full border border-gray-300 px-3.5 py-2.5 rounded-xl text-xs outline-none focus:border-indigo-600 mb-4">
            
            <button onclick="connectWithToken()" class="w-full bg-indigo-950 hover:bg-indigo-900 text-white font-bold py-2.5 rounded-xl text-xs transition">
                Connect Account
            </button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="bg-indigo-50/50 p-2 border-b border-gray-200 overflow-x-auto whitespace-nowrap">
        <div class="max-w-4xl mx-auto flex space-x-2">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn bg-indigo-950 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i> <span>Dashboard</span>
            </button>
            <button onclick="switchTab('speedbot')" id="btn-speedbot" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-rocket"></i> <span>SpeedBot</span>
            </button>
            <button onclick="switchTab('analysis')" id="btn-analysis" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-chart-line"></i> <span>Analysis</span>
            </button>
            <button onclick="switchTab('smart')" id="btn-smart" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-brain"></i> <span>Smart</span>
            </button>
            <button onclick="switchTab('autobots')" id="btn-autobots" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-robot"></i> <span>AutoBots</span>
            </button>
            <button onclick="switchTab('builder')" id="btn-builder" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-wrench"></i> <span>Builder</span>
            </button>
        </div>
    </div>

    <!-- Live Ticker Bar -->
    <div class="max-w-4xl mx-auto p-4 pb-0">
        <div class="bg-gray-900 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <select id="symbolSelect" onchange="changeSymbol()" class="bg-gray-800 text-white text-xs font-bold rounded-lg px-2 py-1 outline-none">
                    <option value="R_100">Volatility 100 Index</option>
                    <option value="R_75">Volatility 75 Index</option>
                    <option value="R_50">Volatility 50 Index</option>
                    <option value="1HZ100V">Volatility 100 (1s) Index</option>
                </select>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-gray-400 block font-semibold uppercase">Live Tick</span>
                <span id="livePrice" class="text-lg font-mono font-bold text-amber-400">Disconnected</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4">
        <!-- DASHBOARD -->
        <div id="tab-dashboard" class="tab-content space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                    <span class="text-xs text-gray-500 font-semibold block">Total Profit/Loss</span>
                    <span id="totalPL" class="text-xl font-black text-gray-800">$0.00</span>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                    <span class="text-xs text-gray-500 font-semibold block">Win Rate</span>
                    <span id="winRate" class="text-xl font-black text-gray-800">0%</span>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let ws = null;
        let activeSymbol = 'R_100';

        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('deriv_api_token');
            if (savedToken) {
                document.getElementById('apiTokenInput').value = savedToken;
                connectWithToken();
            }
        });

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function connectWithToken() {
            const token = document.getElementById('apiTokenInput').value.trim();
            if (!token) {
                alert('Please enter a valid API Token');
                return;
            }

            localStorage.setItem('deriv_api_token', token);
            document.getElementById('livePrice').innerText = 'Connecting...';

            if (ws) {
                try { ws.close(); } catch(e){}
            }

            ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1010');

            ws.onopen = () => {
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.msg_type === 'authorize') {
                    if (data.error) {
                        alert('Deriv Error: ' + data.error.message);
                        disconnectToken();
                        return;
                    }
                    closeLoginModal();
                    document.getElementById('loggedOutNav').classList.add('hidden');
                    document.getElementById('loggedInNav').classList.remove('hidden');
                    document.getElementById('userAccountId').innerText = data.authorize.loginid;
                    document.getElementById('userBalance').innerText = '$' + data.authorize.balance + ' ' + data.authorize.currency;

                    // Subscribe to ticks
                    subscribeTicks(activeSymbol);
                }

                if (data.msg_type === 'tick') {
                    if (data.tick) {
                        document.getElementById('livePrice').innerText = data.tick.quote;
                    }
                }
            };

            ws.onerror = () => {
                document.getElementById('livePrice').innerText = 'Reconnecting...';
            };
        }

        function subscribeTicks(symbol) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ forget_all: 'ticks' }));
                ws.send(JSON.stringify({ ticks: symbol }));
            }
        }

        function changeSymbol() {
            activeSymbol = document.getElementById('symbolSelect').value;
            subscribeTicks(activeSymbol);
        }

        function disconnectToken() {
            localStorage.removeItem('deriv_api_token');
            if (ws) {
                try { ws.close(); } catch(e){}
            }
            document.getElementById('loggedInNav').classList.add('hidden');
            document.getElementById('loggedOutNav').classList.remove('hidden');
            document.getElementById('livePrice').innerText = 'Disconnected';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-950', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });

            const selectedTab = document.getElementById('tab-' + tabName);
            const selectedBtn = document.getElementById('btn-' + tabName);

            if (selectedTab) selectedTab.classList.remove('hidden');
            if (selectedBtn) {
                selectedBtn.classList.remove('bg-white', 'text-gray-700');
                selectedBtn.classList.add('bg-indigo-950', 'text-white');
            }
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
