<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuskanDangerBotPro - BinaryTools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-login { background: #2563eb; color: white; margin-bottom: 12px; }
    .btn-login:hover { background: #1d4ed8; }
    .btn-logout { background: #ef4444; color: white; display: none; margin-top: 10px; }
    .status { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; display: none; }
    .status.success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .status.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .status.info { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    .user-info { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; text-align: left; display: none; }
    .user-info p { margin-bottom: 4px; font-size: 13px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <h2>MuskanDangerBotPro</h2>
    <p>Login with Personal Access Token (PAT)</p>

    <div id="auth-box">
      <div class="input-group">
        <label for="api-token">Personal Access Token</label>
        <input type="password" id="api-token" placeholder="Enter your token...">
      </div>
      <button class="btn-login" id="login-btn">Login</button>
    </div>

    <div class="status" id="status-msg"></div>

    <div class="user-info" id="user-info">
      <p><strong>Account ID:</strong> <span id="user-loginid">-</span></p>
      <p><strong>Balance:</strong> <span id="user-balance">-</span></p>
      <p><strong>Currency:</strong> <span id="user-currency">-</span></p>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </div>

  <script>
    const APP_ID = 1089;
    const WS_URL = `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;
    let ws = null;

    const tokenInput = document.getElementById('api-token');
    const loginBtn = document.getElementById('login-btn');
    const statusMsg = document.getElementById('status-msg');
    const authBox = document.getElementById('auth-box');
    const userInfo = document.getElementById('user-info');
    const userLoginid = document.getElementById('user-loginid');
    const userBalance = document.getElementById('user-balance');
    const userCurrency = document.getElementById('user-currency');
    const logoutBtn = document.getElementById('logout-btn');

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = `status ${type}`;
      statusMsg.style.display = 'block';
    }

    function authenticateToken(token) {
      showStatus('Authorizing with personal access token...', 'info');

      if (ws) ws.close();

      try {
        ws = new WebSocket(WS_URL);
      } catch (err) {
        showStatus('Failed to connect to server.', 'error');
        return;
      }

      ws.onopen = () => {
        // Send authorize request using the token format
        ws.send(JSON.stringify({ authorize: token }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.error) {
            showStatus(data.error.message, 'error');
            localStorage.removeItem('deriv_pat');
            return;
          }

          if (data.msg_type === 'authorize') {
            showStatus('Successfully authorized!', 'success');
            localStorage.setItem('deriv_pat', token);

            authBox.style.display = 'none';
            userInfo.style.display = 'block';

            userLoginid.textContent = data.authorize.loginid;
            userBalance.textContent = `${data.authorize.balance} ${data.authorize.currency}`;
            userCurrency.textContent = data.authorize.currency;

            // Subscribe to live balance updates
            ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          }

          if (data.msg_type === 'balance' && data.balance) {
            userBalance.textContent = `${data.balance.balance} ${data.balance.currency}`;
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onerror = () => {
        showStatus('Failed to fetch accounts: Connection error', 'error');
      };
    }

    loginBtn.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (!token) {
        showStatus('Please enter your Personal Access Token.', 'error');
        return;
      }
      authenticateToken(token);
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('deriv_pat');
      if (ws) ws.close();
      authBox.style.display = 'block';
      userInfo.style.display = 'none';
      statusMsg.style.display = 'none';
      tokenInput.value = '';
    });

    window.addEventListener('load', () => {
      const savedToken = localStorage.getItem('deriv_pat');
      if (savedToken) {
        tokenInput.value = savedToken;
        authenticateToken(savedToken);
      }
    });
  </script>

</body>
</html>
