<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuskanDangerBotPro - BinaryTools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>MuskanDangerBotPro</h2>
    <p>Enter your Deriv API Token to connect your account.</p>

    <div id="auth-box">
      <div class="input-group">
        <label for="api-token">API TOKEN</label>
        <input type="text" id="api-token" placeholder="Paste your API Token here...">
      </div>
      <button class="btn-connect" id="connect-btn">Connect Token</button>
    </div>

    <div class="status" id="status-msg"></div>

    <div class="user-info" id="user-info">
      <p><strong>Account ID:</strong> <span id="user-loginid">-</span></p>
      <p><strong>Balance:</strong> <span id="user-balance">-</span></p>
      <p><strong>Currency:</strong> <span id="user-currency">-</span></p>
      <button class="btn-logout" id="logout-btn">Disconnect Account</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
