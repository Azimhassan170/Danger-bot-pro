<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaryTools - Deriv Live Trading Platform</title>

    <!-- PWA Manifest & Description -->
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="Danger Devil Bot Pro Trading Application">

    <!-- Stylesheets & Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center space-x-3">
            <button class="text-gray-600 text-xl"><i class="fa-solid fa-bars"></i></button>
            <a href="https://t.me" target="_blank" class="bg-sky-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center space-x-1">
                <i class="fa-paper-plane"></i> <span>Telegram</span>
            </a>
        </div>

        <!-- Before Login -->
        <div id="loggedOutNav" class="flex items-center space-x-2">
            <button onclick="loginWithDeriv()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded-xl text-xs flex items-center space-x-2">
                <span class="font-black text-lg">d</span> <span>Deriv OAuth Login</span>
            </button>
        </div>

        <!-- After Login -->
        <div id="loggedInNav" class="hidden flex items-center space-x-3">
            <div class="text-right">
                <span id="userAccountId" class="text-xs font-bold text-gray-800 block">CR000000</span>
                <span id="userBalance" class="text-xs font-black text-emerald-600">$0.00 USD</span>
            </div>
            <button onclick="logoutDeriv()" class="bg-rose-100 text-rose-600 font-bold px-3 py-1.5 rounded-xl text-xs">
                Logout
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-indigo-50/50 p-2 border-b border-gray-200 overflow-x-auto whitespace-nowrap">
        <div class="max-w-4xl mx-auto flex space-x-2">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn bg-indigo-950 text-white px-4 py-2 rounded-xl text-xs font-bold">Dashboard</button>
            <button onclick="switchTab('speedbot')" id="btn-speedbot" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">SpeedBot</button>
            <button onclick="switchTab('analysis')" id="btn-analysis" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">Analysis</button>
            <button onclick="switchTab('smart')" id="btn-smart" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">Smart</button>
            <button onclick="switchTab('autobots')" id="btn-autobots" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">AutoBots</button>
            <button onclick="switchTab('builder')" id="btn-builder" class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">Builder</button>
        </div>
    </div>

    <!-- Live Ticker Bar -->
    <div class="max-w-4xl mx-auto p-4 pb-0">
        <div class="bg-gray-900 text-white p-3.5 rounded-2xl flex items-center justify-between shadow-md">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <select id="symbolSelect" onchange="changeSymbol()" class="bg-gray-800 text-white text-xs font-bold rounded-lg px-2 py-1 outline-none">
                    <option value="R_100">Volatility 100 Index</option>
                    <option value="R_75">Volatility 75 Index</option>
                    <option value="R_50">Volatility 50 Index</option>
                    <option value="1HZ100V">Volatility 100 (1s) Index</option>
                </select>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-gray-400 block font-semibold uppercase">Live Tick</span>
                <span id="livePrice" class="text-lg font-mono font-bold text-amber-400">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4">
        <!-- DASHBOARD -->
        <div id="tab-dashboard" class="tab-content space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                    <span class="text-xs text-gray-500 font-semibold block">Total Profit/Loss</span>
                    <span id="totalPL" class="text-xl font-black text-gray-800">$0.00</span>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                    <span class="text-xs text-gray-500 font-semibold block">Win Rate</span>
                    <span id="winRate" class="text-xl font-black text-gray-800">0%</span>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Deriv App ID
        var appId = '34zYQuSclB38QunN2PDPq';

        // Check OAuth redirect token on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token1 = urlParams.get('token1');
            const acct1 = urlParams.get('acct1');

            if (token1) {
                localStorage.setItem('deriv_token', token1);
                localStorage.setItem('deriv_acct', acct1);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            checkLoginStatus();
        });

        function checkLoginStatus() {
            const token = localStorage.getItem('deriv_token');
            const acct = localStorage.getItem('deriv_acct');
            if (token && acct) {
                document.getElementById('loggedOutNav').classList.add('hidden');
                document.getElementById('loggedInNav').classList.remove('hidden');
                document.getElementById('userAccountId').innerText = acct;
            }
        }

        // Deriv OAuth Login Logic
        function loginWithDeriv() {
            window.location.href = 'https://oauth.deriv.com/oauth2/authorize?app_id=' + appId + '&l=EN&brand=deriv';
        }

        // Logout Logic
        function logoutDeriv() {
            localStorage.removeItem('deriv_token');
            localStorage.removeItem('deriv_acct');
            document.getElementById('loggedInNav').classList.add('hidden');
            document.getElementById('loggedOutNav').classList.remove('hidden');
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-950', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });

            const selectedTab = document.getElementById('tab-' + tabName);
            const selectedBtn = document.getElementById('btn-' + tabName);

            if (selectedTab) selectedTab.classList.remove('hidden');
            if (selectedBtn) {
                selectedBtn.classList.remove('bg-white', 'text-gray-700');
                selectedBtn.classList.add('bg-indigo-950', 'text-white');
            }
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
