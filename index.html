<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinaryTools Trading Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

  <!-- Header Navigation -->
  <header class="flex justify-between items-center p-4 border-b border-slate-800">
    <h1 class="text-xl font-bold">BinaryTools</h1>
    <button id="mainLoginBtn" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-semibold transition">
      Log In / Connect API
    </button>
  </header>

  <!-- Login Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
      <h2 class="text-xl font-bold mb-4 text-center">Connect Your Account</h2>
      <p class="text-slate-400 text-sm mb-6 text-center">Enter your Deriv API Token or log in via Deriv OAuth.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">API TOKEN</label>
          <input type="text" id="apiTokenInput" placeholder="e.g. w1A2b3C4d5E6f7G" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button id="saveTokenBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-semibold transition">
          Connect Token
        </button>
        <div class="text-center text-xs text-slate-500 my-2">OR</div>
        <a href="https://oauth.deriv.com/oauth2/authorize?app_id=1089&l=EN" target="_blank" class="block w-full text-center bg-slate-800 hover:bg-slate-700 py-3 rounded-lg font-semibold transition">
          Log in with Deriv OAuth
        </a>
      </div>
      
      <button id="closeModalBtn" class="mt-4 text-xs text-slate-500 hover:text-white w-full text-center">Close</button>
    </div>
  </div>

  <script>
    // 1. Force Unregister Old Service Workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // 2. Modal Toggle Handlers
    const modal = document.getElementById('authModal');
    const loginBtn = document.getElementById('mainLoginBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const saveTokenBtn = document.getElementById('saveTokenBtn');

    loginBtn.addEventListener('click', () => {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    // 3. Connect API Token via WebSocket
    saveTokenBtn.addEventListener('click', () => {
      const token = document.getElementById('apiTokenInput').value.trim();
      if (token) {
        localStorage.setItem('deriv_api_token', token);
        
        const ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
        ws.onopen = () => {
          ws.send(JSON.stringify({ authorize: token }));
        };
        ws.onmessage = (msg) => {
          const data = JSON.parse(msg.data);
          if (data.msg_type === 'authorize') {
            alert('Connected Successfully as: ' + data.authorize.email);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            location.reload();
          } else if (data.error) {
            alert('Invalid Token: ' + data.error.message);
          }
        };
      } else {
        alert('Please enter a valid token');
      }
    });
  </script>
</body>
</html>
